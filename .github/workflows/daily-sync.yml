name: Daily whowatch sync

# ふわっちアイテムマスタ（item_point_mapping）+ イベント一覧（whowatch_events）を毎日 JST 0:00 に同期。
# 既存 scripts/platforms/whowatch/sync_items_and_events.py を実行（標準ライブラリのみ・依存インストール不要）。
# n8n 廃止後の日次同期基盤。
#
# 起動の経路（2026-10-18 変更）:
#   本命: tagtech-internal の Cloudflare Worker「tagtech-cron」（cloudflare/tagtech-cron・ジョブ tagdeck-daily-sync-dispatch）が
#         JST 0:00（UTC 15:00）に GitHub API（POST /repos/tagtech-jp/tagdeck/actions/workflows/daily-sync.yml/dispatches）で
#         workflow_dispatch を起こす。inputs.source=tagtech-cron を付けるので、run-name で手動起動と見分けられる。
#   予備: 下の schedule。GitHub Actions の schedule は毎時 0 分が高負荷帯で、旧 "0 15 * * *" の実測は 22 回すべて
#         3〜7 時間遅れだった（2026-09-26〜10-17・最小 3h13m・最大 7h21m・中央値 4h44m。「数分〜十数分」ではなかった）。
#         公式の助言どおり 0 分以外（17 分）にずらし、本命がすでに成功していれば何もしない（guard ステップ）。
#   どちらの経路でも同期の中身は同じ。所要は約 60〜120 秒。

run-name: "Daily whowatch sync (${{ github.event_name == 'workflow_dispatch' && inputs.source || github.event_name }})"

on:
  schedule:
    - cron: "17 15 * * *" # UTC 15:17 = JST 0:17（予備。本命は tagtech-cron からの workflow_dispatch。cron は UTC 指定）
  workflow_dispatch:
    inputs:
      source:
        description: "起動元。tagtech-cron が自動起動するときは tagtech-cron。手動実行はそのまま（manual）"
        required: false
        default: "manual"
        type: string

# GITHUB_TOKEN に要るのは guard の run 一覧の読み取り（actions: read）と checkout（contents: read）だけ
permissions:
  contents: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 予備（schedule）で起きたとき、直前の JST 0:00 以降にこのワークフローが既に成功していれば何もしない。
      # 二重に同期すると Python 同期の Discord 通知が 1 日 2 回になり、ふわっち API と Supabase への書き込みも重なる。
      # 判定に失敗したときは「待つ」に化けさせず予備を実行する（安全側）。手動・API 起動（workflow_dispatch）は常に実行する。
      - name: Guard (schedule only) - skip if today's sync already succeeded
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "event=$EVENT_NAME: 手動・API 起動は常に実行する"
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 直前の JST 0:00（UTC 15:00）。今日の 15:00 がまだ来ていなければ前日の 15:00
          now=$(date -u +%s)
          boundary=$(date -u -d "$(date -u +%F) 15:00:00" +%s)
          if [ "$boundary" -gt "$now" ]; then boundary=$((boundary - 86400)); fi
          since=$(date -u -d "@$boundary" +%Y-%m-%dT%H:%M:%SZ)
          echo "判定の起点（直前の JST 0:00）: $since"
          if ! json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-sync.yml/runs?status=success&per_page=20"); then
            echo "::warning::run 一覧を取得できなかったため予備起動を実行する"
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hit=$(printf '%s' "$json" | jq -r --arg since "$since" \
            '[.workflow_runs[] | select(.created_at >= $since)] | first // empty | "run \(.id) (\(.event), \(.created_at))"')
          if [ -n "$hit" ]; then
            echo "本日分は既に成功している: $hit。予備起動は何もしない"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$since 以降に成功した run が無いため予備起動を実行する"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Run whowatch item/event daily sync
        if: steps.guard.outputs.skip != 'true'
        working-directory: scripts/platforms/whowatch
        run: python sync_items_and_events.py
        env:
          WHOWATCH_DEVICE_ID: ${{ secrets.WHOWATCH_DEVICE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_TASK: ${{ secrets.DISCORD_WEBHOOK_TASK }}

      # E1b: open/pre の全イベント詳細（名前・区分・ランキング構造・ルール・periods）を同期する。
      # Python 同期の後に tagdeck の Route Handler を呼ぶ。RANKING_SYNC_KEY 未設定なら skip（失敗にしない）。
      # Python 同期が失敗しても走らせる（!cancelled()）。guard が skip のときだけ走らせない
      - name: Sync whowatch event details (tagdeck route)
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        env:
          RANKING_SYNC_KEY: ${{ secrets.RANKING_SYNC_KEY }}
          TAGDECK_BASE_URL: ${{ secrets.TAGDECK_BASE_URL }}
        run: |
          if [ -z "$RANKING_SYNC_KEY" ]; then echo "RANKING_SYNC_KEY is not set; skipping"; exit 0; fi
          BASE="${TAGDECK_BASE_URL:-https://tagdeck.jp}"
          # Workers のサブリクエスト上限のため 3 件ずつ。next_cursor が空になるまでループ（最大 20 回）
          cursor=""; fail=0
          for i in $(seq 1 20); do
            url="$BASE/api/platforms/whowatch/events/sync?force=1&limit=3"
            [ -n "$cursor" ] && url="$url&cursor=$cursor"
            code=$(curl -sS --max-redirs 0 -o /tmp/detail.json -w "%{http_code}" -X POST               -H "X-Sync-Key: $RANKING_SYNC_KEY" -H "Content-Length: 0" "$url")
            echo "=== batch $i HTTP $code"; cat /tmp/detail.json; echo
            if [ "$code" != "200" ]; then fail=1; break; fi
            cursor=$(jq -r '.next_cursor // empty' /tmp/detail.json)
            [ -z "$cursor" ] && break
          done
          [ "$fail" = "0" ]

      # S1: /playitems のアイテムパターン（当たり判定用）を同期する
      - name: Sync whowatch item patterns (tagdeck route)
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        env:
          RANKING_SYNC_KEY: ${{ secrets.RANKING_SYNC_KEY }}
          TAGDECK_BASE_URL: ${{ secrets.TAGDECK_BASE_URL }}
        run: |
          if [ -z "$RANKING_SYNC_KEY" ]; then echo "RANKING_SYNC_KEY is not set; skipping"; exit 0; fi
          BASE="${TAGDECK_BASE_URL:-https://tagdeck.jp}"
          # 200 行/チャンク・1 リクエスト最大 5 チャンク。next_cursor が空になるまでループ（最大 30 回）
          cursor=""; total_inserted=0; total_updated=0; total_failed=0; fail=0
          for i in $(seq 1 30); do
            url="$BASE/api/platforms/whowatch/items/sync"
            [ -n "$cursor" ] && url="$url?cursor=$cursor"
            code=$(curl -sS --max-redirs 0 -o /tmp/items.json -w "%{http_code}" -X POST \
              -H "X-Sync-Key: $RANKING_SYNC_KEY" -H "Content-Length: 0" "$url")
            echo "=== batch $i HTTP $code (cursor=${cursor:-none})"
            if [ "$code" != "200" ]; then head -c 2000 /tmp/items.json; echo; fail=1; break; fi
            jq -r '"processed=\(.processed) inserted=\(.inserted) updated=\(.updated) failed=\(.failed) next_cursor=\(.next_cursor // "none")"' /tmp/items.json
            jq -r 'if .groups then "groups: \(.groups)" else "groups: (なし)" end' /tmp/items.json
            total_inserted=$((total_inserted + $(jq -r '.inserted' /tmp/items.json)))
            total_updated=$((total_updated + $(jq -r '.updated' /tmp/items.json)))
            total_failed=$((total_failed + $(jq -r '.failed' /tmp/items.json)))
            cursor=$(jq -r '.next_cursor // empty' /tmp/items.json)
            [ -z "$cursor" ] && break
          done
          echo "=== total inserted=$total_inserted updated=$total_updated failed=$total_failed"
          [ "$fail" = "0" ] && [ "$total_failed" = "0" ]
