services:
  - type: web
    name: tagdeck-whowatch-poller
    runtime: node
    rootDir: workers/whowatch-poller
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHOWATCH_DEVICE_ID
        sync: false
      # /start /stop の共有キー（X-Sync-Key）。未設定だとサービスは起動しない（2026-10-08）
      - key: POLLER_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: tagdeck-whowatch-poller
          property: host
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "840000"
